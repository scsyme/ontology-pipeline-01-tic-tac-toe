name: Source generator tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r tools/scripts/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Verify generated source register
        run: |
          python tools/scripts/generate_sources.py
          git diff --exit-code -- 01-controlled-vocabulary/sources.md
